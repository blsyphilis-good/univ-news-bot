name: Daily University News Scraper

on:
    schedule:
        # 한국 시간(KST) 매일 오전 07:47 (UTC 22:47) 실행 (정각 트래픽 분산)
        - cron: "47 22 * * *"
    workflow_dispatch:

jobs:
    run-scraper:
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            - name: 저장소 코드 가져오기
              uses: actions/checkout@v4

            - name: 파이썬 3.10 설정
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: 필수 패키지 설치
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: 뉴스 수집 및 구글 시트 동기화 실행
              env:
                  NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
                  NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
                  GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
                  SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
              run: |
                  python main.py

            - name: 결과 파일 저장소 자동 커밋 및 푸시
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"
                  git add .
                  git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update news: $(date +'%Y-%m-%d')" && git push)
